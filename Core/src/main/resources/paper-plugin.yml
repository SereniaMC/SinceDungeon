name: SinceDungeon
version: '${version}'
main: net.danh.sinceDungeon.SinceDungeon
api-version: '1.21'
folia-supported: true
authors: [ VoChiDanh, PixelFen ]
description: "SinceDungeon - Customizable dungeon plugin, modified with permission for use on Serenia"
website: https://gitlab.com/sincerpg/SinceDungeon/-/wikis/home
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    MMOItems:
      load: BEFORE
      required: false
    MythicLib:
      load: BEFORE
      required: false
    MythicMobs:
      load: BEFORE
      required: false
    Multiverse-Inventories:
      load: BEFORE
      required: false
permissions:
  SinceDungeon.admin:
    description: Admin permission for SinceDungeon
    default: op
